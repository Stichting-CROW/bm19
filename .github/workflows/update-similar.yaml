name: Update similar publications

on:
  push:
    branches:
      - main
    paths:
      - "docs/-/catalog/data/*.json"
      - "tools/similar/**"
      - ".github/workflows/update-similar.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  similar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Node 🟢
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/similar/package-lock.json

      - name: Cache model 🧠
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-Xenova-multilingual-e5-base

      - name: Install dependencies 📦
        working-directory: tools/similar
        run: npm ci

      - name: Build similar.json 🔗
        working-directory: tools/similar
        run: npm run build

      - name: Commit changes 💾
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/-/catalog/data/similar.json
          if git diff --cached --quiet; then
            echo "similar.json is up to date"
          else
            git commit -m "chore: update similar publications" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
